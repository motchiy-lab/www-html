name = "www-html"
compatibility_date = "2026-03-08"

main = "@astrojs/cloudflare/entrypoints/server"

compatibility_flags = [
  "nodejs_compat",
  "global_fetch_strictly_public"
]

[assets]
binding = "ASSETS"
directory = "./dist/client"

[[kv_namespaces]]
binding = "SESSION"
id = "1b1f9788e82346bdb2219ed4712abf4a"

[vars]
CONTACT_FROM_EMAIL = "contact@motchiy.com"
CONTACT_TO_EMAIL = "motchiy.0001@gmail.com"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
